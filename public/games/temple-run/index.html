<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Temple Run — Pixelverse Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0805;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* HUD Overlays */
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }
    .hud-stat {
      background: rgba(14, 11, 7, 0.75);
      border: 2px solid rgba(212, 175, 55, 0.4);
      border-radius: 12px;
      padding: 8px 16px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
    }
    .hud-label {
      font-size: 11px;
      font-weight: 800;
      color: #e5c158;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hud-val {
      font-size: 20px;
      font-weight: 900;
      font-family: monospace;
      color: #fff;
    }
    .coin-icon {
      width: 22px;
      height: 22px;
      background: radial-gradient(circle at 35% 35%, #fff799, #f59e0b, #b45309);
      border-radius: 50%;
      border: 2px solid #fef08a;
      box-shadow: 0 0 10px #f59e0b;
      display: inline-block;
    }

    /* Screen Modals */
    .screen-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(16, 12, 8, 0.85) 0%, rgba(6, 4, 2, 0.96) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      color: #fff;
      padding: 24px;
      text-align: center;
    }
    .title-banner {
      font-size: clamp(32px, 8vw, 56px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: #fef08a;
      text-shadow: 0 0 20px rgba(245, 158, 11, 0.7), 0 4px 0 #92400e, 0 8px 12px rgba(0,0,0,0.8);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: #fde68a;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 24px;
      text-transform: uppercase;
    }
    .instructions-card {
      background: rgba(28, 20, 12, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 16px;
      padding: 16px 24px;
      margin-bottom: 24px;
      max-width: 380px;
      font-size: 12px;
      color: #e2d3b3;
      line-height: 1.8;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    .key-badge {
      display: inline-block;
      padding: 2px 7px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      font-weight: 800;
      color: #fff;
      font-size: 11px;
    }
    .btn-gold {
      background: linear-gradient(180deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
      color: #291201;
      font-size: 18px;
      font-weight: 900;
      padding: 14px 40px;
      border-radius: 9999px;
      border: 2px solid #fef08a;
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.6), 0 6px 0 #78350f, 0 10px 15px rgba(0,0,0,0.6);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.15s ease;
    }
    .btn-gold:active {
      transform: translateY(4px);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4), 0 2px 0 #78350f;
    }

    /* Mobile On-Screen Tactile Controls */
    #mobile-controls {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: none;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: none;
      z-index: 15;
    }
    .touch-btn-group {
      display: flex;
      gap: 12px;
    }
    .touch-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(20, 16, 10, 0.75);
      border: 2px solid rgba(212, 175, 55, 0.5);
      color: #fef08a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      pointer-events: auto;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      touch-action: manipulation;
    }
    .touch-btn:active {
      background: rgba(245, 158, 11, 0.4);
      transform: scale(0.92);
    }
    @media (hover: none) and (pointer: coarse) {
      #mobile-controls { display: flex; }
    }
    .score-breakdown {
      margin: 16px 0 24px;
      font-size: 15px;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .score-highlight {
      font-size: 28px;
      font-weight: 900;
      color: #fef08a;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="hud" style="display: none;">
    <div class="hud-stat">
      <span class="coin-icon"></span>
      <div>
        <div class="hud-label">Coins</div>
        <div class="hud-val" id="hud-coins">0</div>
      </div>
    </div>
    <div class="hud-stat">
      <div>
        <div class="hud-label">Distance</div>
        <div class="hud-val"><span id="hud-meters">0</span> <span style="font-size: 12px; color: #a1a1aa;">m</span></div>
      </div>
    </div>
  </div>

  <!-- Start Screen -->
  <div id="start-screen" class="screen-overlay">
    <div class="title-banner">Temple Run</div>
    <div class="subtitle">Pixelverse 3D Expedition</div>
    <div class="instructions-card">
      <div><span class="key-badge">A</span> <span class="key-badge">D</span> or <span class="key-badge">←</span> <span class="key-badge">→</span> : Switch Lanes</div>
      <div><span class="key-badge">W</span> or <span class="key-badge">↑</span> or <span class="key-badge">Space</span> : Jump Over Gaps & Fire</div>
      <div><span class="key-badge">S</span> or <span class="key-badge">↓</span> : Slide Under Tree Logs</div>
      <div style="margin-top: 6px; color: #f59e0b; font-weight: 700;">Mobile: Swipe or tap on-screen arrows</div>
    </div>
    <button class="btn-gold" id="start-btn">Escape Temple</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen" class="screen-overlay" style="display: none;">
    <div class="title-banner" style="color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.7);">Temple Slain</div>
    <div class="subtitle">The demon beast caught you!</div>
    <div class="score-breakdown">
      <div>Distance Traveled: <span class="score-highlight" id="final-dist">0</span> m</div>
      <div>Coins Looted: <span class="score-highlight" style="color: #f59e0b;" id="final-coins">0</span></div>
      <div>High Score: <span class="score-highlight" style="color: #10b981;" id="final-best">0</span> m</div>
    </div>
    <button class="btn-gold" id="restart-btn">Play Again</button>
  </div>

  <!-- Mobile On-Screen Buttons -->
  <div id="mobile-controls">
    <div class="touch-btn-group">
      <button class="touch-btn" id="btn-left">←</button>
      <button class="touch-btn" id="btn-right">→</button>
    </div>
    <div class="touch-btn-group">
      <button class="touch-btn" id="btn-slide">↓</button>
      <button class="touch-btn" id="btn-jump">↑</button>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script type="module">
    import * as THREE from './three.module.js';

    /* --- Sound Synthesizer (Web Audio API) --- */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playCoin() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(987.77, now); // B5
        osc.frequency.exponentialRampToValueAtTime(1318.51, now + 0.12); // E6
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      playJump() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.18);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.26);
      }
      playSlide() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(600, now);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }
      playCrash() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(30, now + 0.4);
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.46);
      }
    }

    const sound = new SoundEngine();

    /* --- Game Configuration --- */
    const LANES = [-2.2, 0, 2.2];
    const CHUNK_LENGTH = 40;
    const TOTAL_CHUNKS = 12;
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let scoreDistance = 0;
    let coinsCollected = 0;
    let currentLane = 1; // 0=left, 1=middle, 2=right
    let targetX = 0;
    let runSpeed = 24; // Units per second
    let maxSpeed = 48;
    let highscore = parseInt(localStorage.getItem('pixelverse_templerun_best') || '0', 10);

    /* --- Setup Three.js Engine --- */
    const canvas = document.getElementById('game-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0d0a07');
    scene.fog = new THREE.FogExp2('#140f0a', 0.016);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 4.2, 5.5);
    camera.lookAt(0, 1.8, -6);

    /* --- Lighting --- */
    const ambientLight = new THREE.AmbientLight('#ffe5b4', 0.85);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight('#ffecd1', 1.6);
    dirLight.position.set(15, 25, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 80;
    dirLight.shadow.camera.left = -15;
    dirLight.shadow.camera.right = 15;
    dirLight.shadow.camera.top = 20;
    dirLight.shadow.camera.bottom = -20;
    scene.add(dirLight);

    // Warm temple torch point light following player
    const torchLight = new THREE.PointLight('#f59e0b', 2, 16, 1.5);
    scene.add(torchLight);

    /* --- Materials Library --- */
    const stonePathMat = new THREE.MeshStandardMaterial({
      color: '#3d3126',
      roughness: 0.85,
      metalness: 0.1,
    });
    const stoneBorderMat = new THREE.MeshStandardMaterial({
      color: '#654f3a',
      roughness: 0.7,
      metalness: 0.15,
    });
    const pillarMat = new THREE.MeshStandardMaterial({
      color: '#2a221a',
      roughness: 0.9,
    });
    const woodLogMat = new THREE.MeshStandardMaterial({
      color: '#452c1a',
      roughness: 0.8,
    });
    const spikeMat = new THREE.MeshStandardMaterial({
      color: '#71717a',
      metalness: 0.8,
      roughness: 0.3,
    });
    const firePitMat = new THREE.MeshBasicMaterial({
      color: '#ea580c',
    });
    const goldCoinMat = new THREE.MeshStandardMaterial({
      color: '#fbbf24',
      metalness: 0.9,
      roughness: 0.15,
      emissive: '#d97706',
      emissiveIntensity: 0.35,
    });

    /* --- Player Character Construction --- */
    const playerGroup = new THREE.Group();

    // Body (Explorer jacket)
    const bodyGeo = new THREE.BoxGeometry(0.7, 0.9, 0.5);
    const bodyMat = new THREE.MeshStandardMaterial({ color: '#78350f', roughness: 0.8 });
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.position.y = 1.15;
    bodyMesh.castShadow = true;
    playerGroup.add(bodyMesh);

    // Head with Adventure Fedora Hat
    const headGeo = new THREE.BoxGeometry(0.45, 0.45, 0.45);
    const headMat = new THREE.MeshStandardMaterial({ color: '#fcd34d', roughness: 0.6 });
    const headMesh = new THREE.Mesh(headGeo, headMat);
    headMesh.position.y = 1.8;
    headMesh.castShadow = true;
    playerGroup.add(headMesh);

    const hatBrimGeo = new THREE.BoxGeometry(0.75, 0.08, 0.75);
    const hatMat = new THREE.MeshStandardMaterial({ color: '#451a03', roughness: 0.9 });
    const hatBrim = new THREE.Mesh(hatBrimGeo, hatMat);
    hatBrim.position.y = 2.05;
    playerGroup.add(hatBrim);

    const hatCrownGeo = new THREE.BoxGeometry(0.5, 0.25, 0.5);
    const hatCrown = new THREE.Mesh(hatCrownGeo, hatMat);
    hatCrown.position.y = 2.2;
    playerGroup.add(hatCrown);

    // Limbs
    const legGeo = new THREE.BoxGeometry(0.24, 0.7, 0.26);
    const legMat = new THREE.MeshStandardMaterial({ color: '#1e293b', roughness: 0.8 });
    const leftLeg = new THREE.Mesh(legGeo, legMat);
    leftLeg.position.set(-0.2, 0.38, 0);
    leftLeg.castShadow = true;
    playerGroup.add(leftLeg);

    const rightLeg = new THREE.Mesh(legGeo, legMat);
    rightLeg.position.set(0.2, 0.38, 0);
    rightLeg.castShadow = true;
    playerGroup.add(rightLeg);

    const armGeo = new THREE.BoxGeometry(0.18, 0.65, 0.2);
    const armMat = new THREE.MeshStandardMaterial({ color: '#b45309', roughness: 0.8 });
    const leftArm = new THREE.Mesh(armGeo, armMat);
    leftArm.position.set(-0.46, 1.15, 0);
    leftArm.castShadow = true;
    playerGroup.add(leftArm);

    const rightArm = new THREE.Mesh(armGeo, armMat);
    rightArm.position.set(0.46, 1.15, 0);
    rightArm.castShadow = true;
    playerGroup.add(rightArm);

    scene.add(playerGroup);

    /* --- Demon Monster Chaser --- */
    const monsterGroup = new THREE.Group();
    const monsterBodyGeo = new THREE.BoxGeometry(1.6, 1.8, 1.2);
    const monsterBodyMat = new THREE.MeshStandardMaterial({ color: '#18181b', roughness: 0.95 });
    const monsterBody = new THREE.Mesh(monsterBodyGeo, monsterBodyMat);
    monsterBody.position.y = 1.4;
    monsterBody.castShadow = true;
    monsterGroup.add(monsterBody);

    // Glowing Demon Eyes
    const eyeGeo = new THREE.SphereGeometry(0.12, 8, 8);
    const eyeMat = new THREE.MeshBasicMaterial({ color: '#ef4444' });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
    eyeL.position.set(-0.4, 1.8, -0.6);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
    eyeR.position.set(0.4, 1.8, -0.6);
    monsterGroup.add(eyeL);
    monsterGroup.add(eyeR);

    // Monster Huge Arms
    const monsterArmGeo = new THREE.BoxGeometry(0.4, 1.2, 0.5);
    const monsterArmL = new THREE.Mesh(monsterArmGeo, monsterBodyMat);
    monsterArmL.position.set(-1.0, 1.1, 0);
    const monsterArmR = new THREE.Mesh(monsterArmGeo, monsterBodyMat);
    monsterArmR.position.set(1.0, 1.1, 0);
    monsterGroup.add(monsterArmL);
    monsterGroup.add(monsterArmR);

    monsterGroup.position.set(0, 0, 4.5);
    scene.add(monsterGroup);

    /* --- Physics & Action Variables --- */
    let playerY = 0;
    let playerVy = 0;
    const gravity = -42;
    let isJumping = false;
    let isSliding = false;
    let slideTimer = 0;
    let runCycle = 0;

    /* --- Track Chunk Builder --- */
    const trackChunks = [];
    const activeObstacles = [];
    const activeCoins = [];

    const coinGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.08, 16);
    coinGeo.rotateX(Math.PI / 2);

    function createChunk(zOffset) {
      const chunk = new THREE.Group();
      chunk.position.z = zOffset;

      // Stone Path Slab
      const pathGeo = new THREE.BoxGeometry(6.6, 0.6, CHUNK_LENGTH);
      const pathMesh = new THREE.Mesh(pathGeo, stonePathMat);
      pathMesh.position.y = -0.3;
      pathMesh.receiveShadow = true;
      chunk.add(pathMesh);

      // Elevated Stone Border Curbs
      const curbGeo = new THREE.BoxGeometry(0.4, 0.5, CHUNK_LENGTH);
      const curbL = new THREE.Mesh(curbGeo, stoneBorderMat);
      curbL.position.set(-3.3, 0.1, 0);
      curbL.receiveShadow = true;
      chunk.add(curbL);

      const curbR = new THREE.Mesh(curbGeo, stoneBorderMat);
      curbR.position.set(3.3, 0.1, 0);
      curbR.receiveShadow = true;
      chunk.add(curbR);

      // Pillars with Torches along side edges
      const pillarCount = 4;
      const step = CHUNK_LENGTH / pillarCount;
      for (let i = 0; i < pillarCount; i++) {
        const pz = -CHUNK_LENGTH / 2 + i * step + step / 2;
        [-4.2, 4.2].forEach((px) => {
          const pillarGeo = new THREE.BoxGeometry(0.8, 7, 0.8);
          const pillar = new THREE.Mesh(pillarGeo, pillarMat);
          pillar.position.set(px, 3.2, pz);
          pillar.castShadow = true;
          pillar.receiveShadow = true;
          chunk.add(pillar);

          // Torch Bowl
          const torchBowlGeo = new THREE.ConeGeometry(0.3, 0.4, 8);
          const torchBowl = new THREE.Mesh(torchBowlGeo, stoneBorderMat);
          torchBowl.position.set(px > 0 ? px - 0.5 : px + 0.5, 5, pz);
          torchBowl.rotateZ(px > 0 ? 0.4 : -0.4);
          chunk.add(torchBowl);

          const flame = new THREE.Mesh(
            new THREE.SphereGeometry(0.18, 8, 8),
            new THREE.MeshBasicMaterial({ color: '#f59e0b' })
          );
          flame.position.copy(torchBowl.position);
          flame.position.y += 0.25;
          chunk.add(flame);
        });
      }

      // Add Random Obstacles on this chunk
      spawnChunkObstacles(chunk, zOffset);

      scene.add(chunk);
      return chunk;
    }

    function spawnChunkObstacles(chunk, zOffset) {
      if (Math.abs(zOffset) < 30) return; // Free clear runway at the beginning

      const positions = [-CHUNK_LENGTH * 0.35, 0, CHUNK_LENGTH * 0.35];

      positions.forEach((zLocal) => {
        const rand = Math.random();

        if (rand < 0.32) {
          // Slide Obstacle: Fallen Ancient Tree Log / Stone Beam
          const logGroup = new THREE.Group();
          const logMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 6.6, 12), woodLogMat);
          logMesh.rotateZ(Math.PI / 2);
          logMesh.position.y = 1.35; // Head height: must slide underneath!
          logMesh.castShadow = true;
          logGroup.add(logMesh);

          // Side Support Stands
          const standL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2, 0.3), woodLogMat);
          standL.position.set(-3.2, 0.8, 0);
          const standR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2, 0.3), woodLogMat);
          standR.position.set(3.2, 0.8, 0);
          logGroup.add(standL);
          logGroup.add(standR);

          logGroup.position.set(0, 0, zLocal);
          chunk.add(logGroup);

          activeObstacles.push({
            parent: chunk,
            mesh: logGroup,
            type: 'slide',
            zLocal: zLocal,
            lane: 'all',
            radius: 0.6,
          });
        } else if (rand < 0.62) {
          // Jump Obstacle: Ancient Spikes / Fire Gap
          const spikeGroup = new THREE.Group();
          for (let s = -2.8; s <= 2.8; s += 0.7) {
            const spike = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.9, 8), spikeMat);
            spike.position.set(s, 0.45, 0);
            spike.castShadow = true;
            spikeGroup.add(spike);
          }
          spikeGroup.position.set(0, 0, zLocal);
          chunk.add(spikeGroup);

          activeObstacles.push({
            parent: chunk,
            mesh: spikeGroup,
            type: 'jump',
            zLocal: zLocal,
            lane: 'all',
            radius: 0.6,
          });
        } else if (rand < 0.88) {
          // Lane Block Obstacle: Big Mayan Stone Block occupying 1 or 2 lanes
          const blockLane = Math.floor(Math.random() * 3);
          const blockGeo = new THREE.BoxGeometry(2.1, 2.2, 1.2);
          const block = new THREE.Mesh(blockGeo, stoneBorderMat);
          block.position.set(LANES[blockLane], 1.1, zLocal);
          block.castShadow = true;
          chunk.add(block);

          activeObstacles.push({
            parent: chunk,
            mesh: block,
            type: 'block',
            zLocal: zLocal,
            lane: blockLane,
            radius: 0.95,
          });
        }

        // Spawn Gold Coins in a lane that isn't completely blocked
        const coinLane = Math.floor(Math.random() * 3);
        for (let c = -2; c <= 2; c++) {
          const coin = new THREE.Mesh(coinGeo, goldCoinMat);
          coin.position.set(LANES[coinLane], 0.8, zLocal + c * 1.6);
          coin.castShadow = true;
          chunk.add(coin);

          activeCoins.push({
            parent: chunk,
            mesh: coin,
            lane: coinLane,
            zLocal: zLocal + c * 1.6,
            collected: false,
          });
        }
      });
    }

    // Initialize track ring
    for (let i = 0; i < TOTAL_CHUNKS; i++) {
      trackChunks.push(createChunk(-i * CHUNK_LENGTH));
    }

    /* --- Player Controls --- */
    function moveLeft() {
      if (gameState !== 'PLAYING') return;
      if (currentLane > 0) {
        currentLane--;
        targetX = LANES[currentLane];
      }
    }
    function moveRight() {
      if (gameState !== 'PLAYING') return;
      if (currentLane < 2) {
        currentLane++;
        targetX = LANES[currentLane];
      }
    }
    function jump() {
      if (gameState !== 'PLAYING') return;
      if (!isJumping && !isSliding) {
        isJumping = true;
        playerVy = 13.5;
        sound.playJump();
      }
    }
    function slide() {
      if (gameState !== 'PLAYING') return;
      if (!isSliding && !isJumping) {
        isSliding = true;
        slideTimer = 0.55; // Slide for half a second
        sound.playSlide();
      }
    }

    // Keyboard Input Listeners
    window.addEventListener('keydown', (e) => {
      sound.init();
      if (gameState === 'START' && (e.code === 'Space' || e.code === 'Enter')) {
        startGame();
        return;
      }
      if (gameState === 'GAMEOVER' && (e.code === 'Space' || e.code === 'Enter')) {
        restartGame();
        return;
      }
      switch (e.code) {
        case 'ArrowLeft':
        case 'KeyA':
          moveLeft();
          break;
        case 'ArrowRight':
        case 'KeyD':
          moveRight();
          break;
        case 'ArrowUp':
        case 'KeyW':
        case 'Space':
          jump();
          break;
        case 'ArrowDown':
        case 'KeyS':
          slide();
          break;
      }
    });

    // Touch Swipes
    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      sound.init();
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      if (Math.max(absDx, absDy) > 28) {
        if (absDx > absDy) {
          if (dx > 0) moveRight();
          else moveLeft();
        } else {
          if (dy < 0) jump();
          else slide();
        }
      }
    }, { passive: true });

    // Touch Buttons
    document.getElementById('btn-left').addEventListener('click', (e) => { e.stopPropagation(); sound.init(); moveLeft(); });
    document.getElementById('btn-right').addEventListener('click', (e) => { e.stopPropagation(); sound.init(); moveRight(); });
    document.getElementById('btn-jump').addEventListener('click', (e) => { e.stopPropagation(); sound.init(); jump(); });
    document.getElementById('btn-slide').addEventListener('click', (e) => { e.stopPropagation(); sound.init(); slide(); });

    // Start & Restart buttons
    document.getElementById('start-btn').addEventListener('click', () => { sound.init(); startGame(); });
    document.getElementById('restart-btn').addEventListener('click', () => { sound.init(); restartGame(); });

    function startGame() {
      gameState = 'PLAYING';
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      sound.playCrash();
      document.getElementById('gameover-screen').style.display = 'flex';
      document.getElementById('final-dist').innerText = Math.floor(scoreDistance);
      document.getElementById('final-coins').innerText = coinsCollected;

      if (scoreDistance > highscore) {
        highscore = Math.floor(scoreDistance);
        localStorage.setItem('pixelverse_templerun_best', highscore.toString());
      }
      document.getElementById('final-best').innerText = highscore;
    }

    function restartGame() {
      // Reset state
      scoreDistance = 0;
      coinsCollected = 0;
      currentLane = 1;
      targetX = 0;
      playerGroup.position.set(0, 0, 0);
      playerY = 0;
      playerVy = 0;
      isJumping = false;
      isSliding = false;
      runSpeed = 24;

      // Clear existing obstacles and coins
      activeObstacles.forEach((o) => o.parent.remove(o.mesh));
      activeObstacles.length = 0;
      activeCoins.forEach((c) => c.parent.remove(c.mesh));
      activeCoins.length = 0;

      // Re-align chunks
      for (let i = 0; i < TOTAL_CHUNKS; i++) {
        trackChunks[i].position.z = -i * CHUNK_LENGTH;
        spawnChunkObstacles(trackChunks[i], -i * CHUNK_LENGTH);
      }

      document.getElementById('hud-coins').innerText = '0';
      document.getElementById('hud-meters').innerText = '0';
      document.getElementById('gameover-screen').style.display = 'none';
      gameState = 'PLAYING';
    }

    /* --- Animation Loop --- */
    let lastFrameTime = performance.now();

    function animate(currentTime) {
      requestAnimationFrame(animate);

      const delta = Math.min((currentTime - lastFrameTime) / 1000, 0.1);
      lastFrameTime = currentTime;

      // Spin floating coins
      for (let i = 0; i < activeCoins.length; i++) {
        activeCoins[i].mesh.rotation.z += delta * 4;
      }

      if (gameState === 'PLAYING') {
        // Accelerate slowly over distance
        runSpeed = Math.min(maxSpeed, runSpeed + delta * 0.4);
        scoreDistance += runSpeed * delta;
        document.getElementById('hud-meters').innerText = Math.floor(scoreDistance);

        // Advance track chunks toward player (infinite treadmill illusion)
        const forwardStep = runSpeed * delta;
        for (let i = 0; i < trackChunks.length; i++) {
          trackChunks[i].position.z += forwardStep;
        }

        // Recycle furthest chunk
        for (let i = 0; i < trackChunks.length; i++) {
          if (trackChunks[i].position.z > CHUNK_LENGTH * 1.5) {
            let minZ = 0;
            for (let j = 0; j < trackChunks.length; j++) {
              if (trackChunks[j].position.z < minZ) minZ = trackChunks[j].position.z;
            }
            const newZ = minZ - CHUNK_LENGTH;
            trackChunks[i].position.z = newZ;

            // Clear old obstacles & coins on this recycled chunk
            for (let k = activeObstacles.length - 1; k >= 0; k--) {
              if (activeObstacles[k].parent === trackChunks[i]) {
                trackChunks[i].remove(activeObstacles[k].mesh);
                activeObstacles.splice(k, 1);
              }
            }
            for (let k = activeCoins.length - 1; k >= 0; k--) {
              if (activeCoins[k].parent === trackChunks[i]) {
                trackChunks[i].remove(activeCoins[k].mesh);
                activeCoins.splice(k, 1);
              }
            }

            // Spawn fresh batch of obstacles & coins on this recycled chunk
            spawnChunkObstacles(trackChunks[i], newZ);
          }
        }

        // Horizontal Lane Smooth Interpolation
        playerGroup.position.x += (targetX - playerGroup.position.x) * (delta * 14);

        // Jump & Gravity Physics
        if (isJumping) {
          playerY += playerVy * delta;
          playerVy += gravity * delta;
          if (playerY <= 0) {
            playerY = 0;
            playerVy = 0;
            isJumping = false;
          }
        }

        // Slide Timer
        if (isSliding) {
          slideTimer -= delta;
          if (slideTimer <= 0) {
            isSliding = false;
          }
        }

        // Player Model Animation (Pumping arms & legs or slide pose)
        runCycle += delta * (runSpeed * 0.65);
        if (isSliding) {
          playerGroup.scale.set(1, 0.45, 1.4);
          playerGroup.position.y = 0.25;
          bodyMesh.rotation.x = 0.6;
          leftLeg.rotation.x = 0.8;
          rightLeg.rotation.x = 0.8;
          leftArm.rotation.x = 0.8;
          rightArm.rotation.x = 0.8;
        } else if (isJumping) {
          playerGroup.scale.set(1, 1, 1);
          playerGroup.position.y = playerY;
          bodyMesh.rotation.x = 0.1;
          leftLeg.rotation.x = -0.5;
          rightLeg.rotation.x = 0.5;
          leftArm.rotation.x = 0.9;
          rightArm.rotation.x = -0.9;
        } else {
          // Normal running stride
          playerGroup.scale.set(1, 1, 1);
          playerGroup.position.y = Math.abs(Math.sin(runCycle * 2)) * 0.18;
          bodyMesh.rotation.x = 0.12;
          leftLeg.rotation.x = Math.sin(runCycle) * 0.9;
          rightLeg.rotation.x = -Math.sin(runCycle) * 0.9;
          leftArm.rotation.x = -Math.sin(runCycle) * 0.9;
          rightArm.rotation.x = Math.sin(runCycle) * 0.9;
        }

        // Demon Monster animation: pounding right behind player
        monsterGroup.position.x += (playerGroup.position.x - monsterGroup.position.x) * (delta * 8);
        monsterGroup.position.y = Math.abs(Math.sin(runCycle * 1.8)) * 0.3;
        monsterArmL.rotation.x = Math.sin(runCycle) * 1.2;
        monsterArmR.rotation.x = -Math.sin(runCycle) * 1.2;

        // Position Torch Light following the player
        torchLight.position.set(playerGroup.position.x, 3.5, -1);

        // Camera follow with slight lean
        camera.position.x += (playerGroup.position.x * 0.6 - camera.position.x) * (delta * 8);
        camera.lookAt(playerGroup.position.x * 0.3, 1.6, -8);

        /* --- Collisions Check --- */
        const playerZ = 0; // In treadmill coordinates, player stays at Z = 0
        const playerWorldX = playerGroup.position.x;

        // 1. Check Obstacle Collisions
        for (let i = 0; i < activeObstacles.length; i++) {
          const obs = activeObstacles[i];
          const obsWorldZ = obs.parent.position.z + obs.zLocal;

          // Check if obstacle is close to player on Z axis
          if (Math.abs(obsWorldZ - playerZ) < 0.8) {
            let hit = false;

            if (obs.type === 'slide') {
              // If not sliding, head hits the fallen log!
              if (!isSliding) hit = true;
            } else if (obs.type === 'jump') {
              // If not high enough in jump, hit the fire/spikes!
              if (playerY < 0.85) hit = true;
            } else if (obs.type === 'block') {
              // If in the same lane as the block, crash!
              const laneX = LANES[obs.lane];
              if (Math.abs(playerWorldX - laneX) < obs.radius) hit = true;
            }

            if (hit) {
              gameOver();
              break;
            }
          }
        }

        // 2. Check Coin Collections
        for (let i = 0; i < activeCoins.length; i++) {
          const coin = activeCoins[i];
          if (coin.collected) continue;

          const coinWorldZ = coin.parent.position.z + coin.zLocal;
          if (Math.abs(coinWorldZ - playerZ) < 0.9) {
            const laneX = LANES[coin.lane];
            if (Math.abs(playerWorldX - laneX) < 1.0) {
              coin.collected = true;
              coin.mesh.visible = false;
              coinsCollected++;
              document.getElementById('hud-coins').innerText = coinsCollected;
              sound.playCoin();
            }
          }
        }
      }

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    /* --- Window Resize Handler --- */
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
